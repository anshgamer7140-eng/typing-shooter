<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Typing Shooter - Created by Ansh</title>
 
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: #070913;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #hiddenInput {
    position: absolute;
    opacity: 0;
    top: -100px;
    left: 0;
    font-size: 16px;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: bold;
    pointer-events: none;
    z-index: 5;
    text-shadow: 0 0 8px #00f3ff;
  }
  .hud-box {
    background: rgba(12, 20, 45, 0.75);
    border: 1px solid #00f3ff;
    padding: 6px 10px;
    border-radius: 6px;
  }
  <div id="overlay">
  <h1 id="overlayTitle">CYBER TYPE</h1>
  <p style="color: #00f3ff; font-size: 16px; margin-bottom: 8px;">Created by Ansh</p>
  <p id="overlayDesc">Words type karke dushman ships ko blast karo! 5 Levels + Final Boss.</p>
  <button id="actionBtn">START LEVEL 1</button>
</div>
  }
  h1 {
    font-size: 28px;
    color: #00f3ff;
    text-shadow: 0 0 15px #00f3ff;
    margin-bottom: 10px;
  }
  p {
    color: #b8c7e0;
    font-size: 15px;
    margin-bottom: 22px;
    max-width: 340px;
    line-height: 1.4;
  }
  button {
    background: linear-gradient(90deg, #00f3ff, #0077ff);
    color: #050811;
    border: none;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
    font-family: inherit;
  }
  button:active { transform: scale(0.96); }
  #kbHint {
    position: absolute;
    bottom: 8px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-box" id="levelDisplay">LVL: 1</div>
  <div class="hud-box" id="progressDisplay">0 / 6</div>
  <div class="hud-box" id="livesDisplay">❤️❤️❤️</div>
  <div class="hud-box" id="scoreDisplay">0</div>
</div>

<div id="overlay">
<p style="color: #00f3ff; font-size: 16px; margin-top: 5px;">Created by Ansh</p>
 
  <title>Typing Shooter - Created by Ansh</title>
 
  <button id="actionBtn">START LEVEL 1</button>
</div>

<div id="kbHint">Tap anywhere if keyboard hides</div>
<input type="text" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">
<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const hiddenInput = document.getElementById('hiddenInput');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayDesc = document.getElementById('overlayDesc');
const actionBtn = document.getElementById('actionBtn');

const levelDisplay = document.getElementById('levelDisplay');
const progressDisplay = document.getElementById('progressDisplay');
const livesDisplay = document.getElementById('livesDisplay');
const scoreDisplay = document.getElementById('scoreDisplay');

let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Simple Web Audio Sound Effects (No external files needed)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;

  if (type === 'laser') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(850, now);
    osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
    osc.start(now);
    osc.stop(now + 0.08);
  } else if (type === 'boom') {
    osc.type = 'square';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.22);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
    osc.start(now);
    osc.stop(now + 0.22);
  } else if (type === 'hurt') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.linearRampToValueAtTime(50, now + 0.3);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  }
}

// Level Configurations
const LEVELS = [
  {
    level: 1,
    name: "LEVEL 1: ROOKIE",
    totalEnemies: 6,
    spawnInterval: 2300,
    speed: 0.45,
    words: ["CAT", "DOG", "SUN", "SKY", "RED", "RUN", "BOX", "FLY", "JET", "STAR", "FIRE", "GOLD"]
  },
  {
    level: 2,
    name: "LEVEL 2: HUNTER",
    totalEnemies: 9,
    spawnInterval: 2000,
    speed: 0.6,
    words: ["SWORD", "FLAME", "GHOST", "POWER", "TIGER", "LASER", "SPEED", "NIGHT", "STORM", "BLADE"]
  },
  {
    level: 3,
    name: "LEVEL 3: SHADOW",
    totalEnemies: 12,
    spawnInterval: 1850,
    speed: 0.72,
    words: ["SHADOW", "DRAGON", "ROCKET", "SNIPER", "HUNTER", "ENERGY", "SYSTEM", "GALAXY", "STRIKE"]
  },
  {
    level: 4,
    name: "LEVEL 4: MASTER",
    totalEnemies: 15,
    spawnInterval: 1700,
    speed: 0.85,
    words: ["WARRIOR", "PHANTOM", "THUNDER", "DIAMOND", "MONSTER", "CYBORG", "VICTORY", "KINGDOM"]
  },
  {
    level: 5,
    name: "LEVEL 5: FINAL BOSS",
    totalEnemies: 1,
    spawnInterval: 1000,
    speed: 0.22,
    isBoss: true,
    bossWords: ["SHADOWMONARCH", "ULTRALIGHTNING", "UNSTOPPABLE"]
  }
];

let currentLevelIdx = 0;
let gameState = 'MENU'; // MENU, PLAYING, LEVEL_CLEAR, GAME_OVER, WIN
let enemies = [];
let lasers = [];
let particles = [];
let stars = [];
let activeEnemy = null;

let score = 0;
let lives = 3;
let spawnedCount = 0;
let destroyedCount = 0;
let lastSpawnTime = 0;

// Background stars
for (let i = 0; i < 45; i++) {
  stars.push({
    x: Math.random() * width,
    y: Math.random() * height,
    size: Math.random() * 2 + 0.5,
    speed: Math.random() * 0.5 + 0.2
  });
}

function focusKeyboard() {
  hiddenInput.value = '';
  hiddenInput.focus();
}

document.body.addEventListener('touchstart', () => {
  if (gameState === 'PLAYING') focusKeyboard();
});
document.body.addEventListener('click', () => {
  if (gameState === 'PLAYING') focusKeyboard();
});

function startLevel(idx) {
  currentLevelIdx = idx;
  const cfg = LEVELS[currentLevelIdx];
  enemies = [];
  lasers = [];
  particles = [];
  activeEnemy = null;
  spawnedCount = 0;
  destroyedCount = 0;
  lastSpawnTime = performance.now() - cfg.spawnInterval + 500;
  gameState = 'PLAYING';
  overlay.style.display = 'none';
  updateHUD();
  focusKeyboard();
}

function updateHUD() {
  const cfg = LEVELS[currentLevelIdx];
  levelDisplay.textContent = `LVL: ${cfg.level}`;
  progressDisplay.textContent = cfg.isBoss ? `BOSS` : `${destroyedCount} / ${cfg.totalEnemies}`;
  livesDisplay.textContent = '❤️'.repeat(Math.max(0, lives));
  scoreDisplay.textContent = score;
}

function spawnEnemy() {
  const cfg = LEVELS[currentLevelIdx];
  if (spawnedCount >= cfg.totalEnemies) return;

  if (cfg.isBoss) {
    enemies.push({
      x: width / 2,
      y: 70,
      wordsQueue: [...cfg.bossWords],
      word: cfg.bossWords[0],
      typedIndex: 0,
      speed: cfg.speed,
      isBoss: true,
      radius: 36
    });
  } else {
    // Pick a word whose first letter isn't already on screen if possible
    const usedFirstLetters = enemies.map(e => e.word[0]);
    let available = cfg.words.filter(w => !usedFirstLetters.includes(w[0]));
    if (available.length === 0) available = cfg.words;
    const chosenWord = available[Math.floor(Math.random() * available.length)];

    const margin = 65;
    const xPos = margin + Math.random() * (width - margin * 2);
    enemies.push({
      x: xPos,
      y: 55,
      word: chosenWord,
      typedIndex: 0,
      speed: cfg.speed + (Math.random() * 0.15),
      isBoss: false,
      radius: 16
    });
  }
  spawnedCount++;
}

function createExplosion(x, y, color, count = 18) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      color
    });
  }
}

// Handle Typing Input (Mobile + PC)
hiddenInput.addEventListener('input', (e) => {
  if (gameState !== 'PLAYING') return;
  const val = hiddenInput.value.toUpperCase().replace(/[^A-Z]/g, '');
  hiddenInput.value = '';
  if (!val) return;

  for (let char of val) {
    processLetter(char);
  }
});

window.addEventListener('keydown', (e) => {
  if (gameState !== 'PLAYING') return;
  if (document.activeElement === hiddenInput) return;
  const key = e.key.toUpperCase();
  if (/^[A-Z]$/.test(key)) {
    processLetter(key);
  }
});

function processLetter(char) {
  // If no target locked, find closest enemy starting with this letter
  if (!activeEnemy || !enemies.includes(activeEnemy)) {
    activeEnemy = null;
    let lowestY = -1;
    for (let enemy of enemies) {
      if (enemy.word[0] === char && enemy.y > lowestY) {
        lowestY = enemy.y;
        activeEnemy = enemy;
      }
    }
  }

  if (activeEnemy && activeEnemy.word[activeEnemy.typedIndex] === char) {
    activeEnemy.typedIndex++;
    score += 10;
    playSound('laser');

    // Shoot laser from player ship
    lasers.push({
      x1: width / 2,
      y1: height - 55,
      x2: activeEnemy.x,
      y2: activeEnemy.y,
      life: 1.0
    });

    // Push enemy back slightly on hit
    activeEnemy.y = Math.max(55, activeEnemy.y - (activeEnemy.isBoss ? 8 : 14));

    // Check if word is completed
    if (activeEnemy.typedIndex >= activeEnemy.word.length) {
      if (activeEnemy.isBoss && activeEnemy.wordsQueue.length > 1) {
        activeEnemy.wordsQueue.shift();
        activeEnemy.word = activeEnemy.wordsQueue[0];
        activeEnemy.typedIndex = 0;
        createExplosion(activeEnemy.x, activeEnemy.y, '#ffaa00', 22);
        playSound('boom');
      } else {
        createExplosion(activeEnemy.x, activeEnemy.y, activeEnemy.isBoss ? '#ff0055' : '#00f3ff', activeEnemy.isBoss ? 45 : 20);
        playSound('boom');
        score += activeEnemy.isBoss ? 500 : 50;
        enemies = enemies.filter(e => e !== activeEnemy);
        activeEnemy = null;
        destroyedCount++;
        checkLevelProgress();
      }
    }
    updateHUD();
  }
}

function checkLevelProgress() {
  const cfg = LEVELS[currentLevelIdx];
  if (destroyedCount >= cfg.totalEnemies) {
    if (currentLevelIdx + 1 < LEVELS.length) {
      gameState = 'LEVEL_CLEAR';
      hiddenInput.blur();
      overlayTitle.textContent = `${cfg.name} CLEARED!`;
      overlayDesc.textContent = `Score: ${score} | Agle level ke liye ready ho jao!`;
      actionBtn.textContent = `START LEVEL ${currentLevelIdx + 2}`;
      overlay.style.display = 'flex';
    } else {
      gameState = 'WIN';
      hiddenInput.blur();
      overlayTitle.textContent = "YOU BEAT THE GAME! 🏆";
      overlayDesc.textContent = `Final Score: ${score} | Tumne saare 5 levels aur Final Boss ko hara diya!`;
      actionBtn.textContent = "PLAY AGAIN";
      overlay.style.display = 'flex';
    }
  }
}

actionBtn.addEventListener('click', () => {
  if (gameState === 'MENU') {
    score = 0;
    lives = 3;
    startLevel(0);
  } else if (gameState === 'LEVEL_CLEAR') {
    startLevel(currentLevelIdx + 1);
  } else if (gameState === 'GAME_OVER' || gameState === 'WIN') {
    score = 0;
    lives = 3;
    startLevel(0);
  }
});

// Main Game Loop
function loop(timestamp) {
  ctx.fillStyle = '#070913';
  ctx.fillRect(0, 0, width, height);

  // Draw Stars
  ctx.fillStyle = '#ffffff';
  for (let s of stars) {
    s.y += s.speed;
    if (s.y > height) { s.y = 0; s.x = Math.random() * width; }
    ctx.globalAlpha = 0.4;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  }
  ctx.globalAlpha = 1.0;

  if (gameState === 'PLAYING') {
    const cfg = LEVELS[currentLevelIdx];
    if (timestamp - lastSpawnTime > cfg.spawnInterval && spawnedCount < cfg.totalEnemies) {
      spawnEnemy();
      lastSpawnTime = timestamp;
    }

    // Update & Draw Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.y += e.speed;

      // Check collision with player zone
      if (e.y >= height - 70) {
        playSound('hurt');
        createExplosion(e.x, e.y, '#ff2a55', 25);
        if (activeEnemy === e) activeEnemy = null;
        enemies.splice(i, 1);
        lives--;
        if (!e.isBoss) {
          // Respawn replacement enemy so level can still complete
          spawnedCount--;
        } else {
          lives = 0;
        }
        updateHUD();

        if (lives <= 0) {
          gameState = 'GAME_OVER';
          hiddenInput.blur();
          overlayTitle.textContent = "GAME OVER";
          overlayDesc.textContent = `Tum Level ${cfg.level} par haar gaye! Final Score: ${score}`;
          actionBtn.textContent = "TRY AGAIN";
          overlay.style.display = 'flex';
        }
        continue;
      }

      // Draw Enemy Ship
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.beginPath();
      if (e.isBoss) {
        ctx.fillStyle = '#ff0055';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 18;
        ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      } else {
        ctx.fillStyle = (e === activeEnemy) ? '#ffaa00' : '#ff3366';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 12;
        ctx.moveTo(0, 16);
        ctx.lineTo(-14, -12);
        ctx.lineTo(14, -12);
        ctx.closePath();
      }
      ctx.fill();
      ctx.restore();

      // Draw Word Box below enemy
      const typedPart = e.word.slice(0, e.typedIndex);
      const remainingPart = e.word.slice(e.typedIndex);
      ctx.font = e.isBoss ? 'bold 20px Courier New' : 'bold 17px Courier New';
      const totalW = ctx.measureText(e.word).width;
      const boxW = totalW + 14;
      const boxH = 26;
      const boxX = e.x - boxW / 2;
      const boxY = e.y + (e.isBoss ? 42 : 20);

      ctx.fillStyle = (e === activeEnemy) ? 'rgba(40, 25, 5, 0.9)' : 'rgba(10, 15, 30, 0.85)';
      ctx.strokeStyle = (e === activeEnemy) ? '#ffaa00' : '#00f3ff';
      ctx.lineWidth = (e === activeEnemy) ? 2 : 1;
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeRect(boxX, boxY, boxW, boxH);

      // Draw Typed vs Remaining Letters
      const startTextX = e.x - totalW / 2;
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#00ff88';
      ctx.fillText(typedPart, startTextX, boxY + boxH / 2);

      const typedW = ctx.measureText(typedPart).width;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(remainingPart, startTextX + typedW, boxY + boxH / 2);
    }
  }

  // Draw Player Ship at bottom
  const px = width / 2;
  const py = height - 45;
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = '#00f3ff';
  ctx.shadowColor = '#00f3ff';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(-18, 16);
  ctx.lineTo(0, 8);
  ctx.lineTo(18, 16);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Draw Lasers
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    ctx.strokeStyle = `rgba(0, 243, 255, ${l.life})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(l.x1, l.y1);
    ctx.lineTo(l.x2, l.y2);
    ctx.stroke();
    l.life -= 0.12;
    if (l.life <= 0) lasers.splice(i, 1);
  }

  // Draw Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.04;
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(p.x, p.y, 4, 4);
    if (p.life <= 0) particles.splice(i, 1);
  }
  ctx.globalAlpha = 1.0;

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
